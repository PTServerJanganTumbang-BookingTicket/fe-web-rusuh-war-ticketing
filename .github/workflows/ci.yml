name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Aturan dependensi antar lapisan (ADR-0002) ditegakkan ESLint boundaries.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build
        run: pnpm build | tee build.log

      # ADR-0007: Home harus tetap statis. Gagal bila `/` berubah menjadi dynamic atau partial.
      - name: Home tetap statis
        run: grep -E '^[┌├└] ○ /[[:space:]]' build.log

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ADR-0013: NEXT_PUBLIC_* di-inline saat build, jadi setiap flag di .env.example wajib punya ARG di Dockerfile.
      - name: Flag build tercatat di Dockerfile
        run: |
          missing=0
          for name in $(grep -oE '^NEXT_PUBLIC_[A-Z0-9_]+' apps/web/.env.example); do
            grep -qE "^ARG $name(=|$)" Dockerfile || { echo "::error file=Dockerfile::ARG $name belum ada"; missing=1; }
          done
          exit $missing

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rusuh-fe:ci
          build-args: NEXT_DEPLOYMENT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ukuran image di bawah 300 MB
        run: |
          size=$(docker image inspect rusuh-fe:ci --format '{{.Size}}')
          echo "Ukuran image: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((300 * 1024 * 1024))

      - name: Smoke test container
        run: |
          docker run -d --name web -p 3000:3000 rusuh-fe:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          test "$(docker inspect -f '{{.Config.User}}' web)" = "app"
          docker stop -t 15 web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pasang Chromium untuk Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Server dev dengan mock MSW dijalankan oleh webServer di playwright.config.ts. Jam palsu lewat page.clock.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
