name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Aturan dependensi antar lapisan dan modul (ADR-0014, ADR-0015) ditegakkan ESLint boundaries.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Build
        run: npm run build | tee build.log

      # ADR-0007: Home harus tetap statis. Gagal bila `/` berubah menjadi dynamic atau partial.
      - name: Home tetap statis
        run: grep -E '^[┌├└] ○ /[[:space:]]' build.log

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Menangkap commit yang melewati hook lokal (--no-verify).
      - run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium

      # Server dev dengan mock MSW dijalankan oleh webServer di playwright.config.ts. Jam palsu lewat page.clock.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
