name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Aturan dependensi antar lapisan dan modul (ADR-0014, ADR-0015) ditegakkan ESLint boundaries.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Build
        run: npm run build | tee build.log

      # ADR-0007: Home harus tetap statis. Gagal bila `/` berubah menjadi dynamic atau partial.
      - name: Home tetap statis
        run: grep -E '^[┌├└] ○ /[[:space:]]' build.log

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Menangkap commit yang melewati hook lokal (--no-verify).
      # PR develop ke main dilewati: commit-nya sudah dicek saat masuk develop, dan commit sebelum aturan ini tidak bisa ditulis ulang.
      - name: Commit pada PR
        if: github.event_name == 'pull_request' && github.head_ref != 'develop'
        run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD

      # Judul PR menjadi pesan commit saat squash merge.
      - name: Judul PR
        if: github.event_name == 'pull_request' && github.head_ref != 'develop'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint

      - name: Commit pada push
        if: github.event_name == 'push'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium

      # Server dev dengan mock MSW dijalankan oleh webServer di playwright.config.ts. Jam palsu lewat page.clock.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
