name: SJT Task Execution
description: Workflow granular per-task dari tasks.md

inputs:
  task_number: "Task number dari tasks.md (e.g., 11, 12, 24)"
  ticket_id: "Ticket ID untuk commit (e.g., SJT-016)"
  actor: "Actor name in Capital Case (Akbar/Muzaki)"

steps:
  - type: step
    id: prepare
    name: "Preparation Phase"
    agent: sjt-coder
    prompt: "Baca Task {{task_number}} dari tasks.md, identifikasi dependencies dan files yang terlibat."

  - type: step
    id: implement
    name: "Implementation Phase"
    agent: sjt-coder
    dependsOn: [prepare]
    prompt: "Implementasi Task {{task_number}} sesuai Clean Architecture: domain-application-data-controller-view."

  - type: step
    id: verify
    name: "Verification Phase"
    agent: sjt-coder
    dependsOn: [implement]
    prompt: "Run npm run lint && npm run typecheck && npm run test --run untuk Task {{task_number}}. Catat hasil test count."

  - type: step
    id: update_tasks
    name: "Update Tasks.md"
    agent: sjt-coder
    dependsOn: [verify]
    prompt: |
      Update tasks.md untuk mark Task {{task_number}} sebagai completed:
      1. Ubah `- [ ] {{task_number}}.` menjadi `- [x] {{task_number}}.`
      2. Ubah semua subtask `- [ ] {{task_number}}.X` menjadi `- [x] {{task_number}}.X`
      3. Stage perubahan tasks.md

  - type: step
    id: commit
    name: "Commit Phase"
    agent: sjt-coder
    dependsOn: [update_tasks]
    prompt: "Commit dengan format [{{ticket_id}}][{{actor}}] type(scope): subject. Include tasks.md update dalam commit."

  - type: step
    id: update_pr_body
    name: "Update PR Body"
    agent: sjt-coder
    dependsOn: [commit]
    prompt: |
      Jika sudah ada PR untuk branch ini, update PR body dengan template dari pr-body-template.md:

      1. Cek apakah ada PR: `gh pr view --json number,body 2>/dev/null`
      2. Jika ada PR, update body dengan `gh pr edit <PR_NUMBER> --body "..."`
      3. PR body harus include:
         - ## Summary: Deskripsi task dari tasks.md
         - ## Changes: Group files by layer (Domain/Application/Data/Controller/View)
         - ## Tasks Completed: Copy dari tasks.md dengan checkbox format
         - ## Test Results: Lint/TypeCheck/Test results dari verification step
         - ## Related: Ticket ID dan requirements references

      Jika belum ada PR, skip step ini (PR akan dibuat manual atau di workflow lain).

      Contoh format lihat di .kiro/memories/pr-body-template.md
