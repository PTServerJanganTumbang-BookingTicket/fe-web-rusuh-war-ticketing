# Konfigurasi SonarCloud. Samakan organization dan projectKey dengan yang tertera di sonarcloud.io.
sonar.organization=ptserverjangantumbang-bookingticket
sonar.projectKey=fe-web-rusuh-war-ticketing
sonar.projectName=fe-web-rusuh-war-ticketing

sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/*.stories.tsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Cakupan dihitung untuk kode logika saja. Daftar ini harus sama dengan `coverage.exclude` di vitest.config.ts:
# view dan components/ui diuji lewat Storybook, halaman dan layout lewat e2e, mock dan test support bukan kode produk.
sonar.coverage.exclusions=**/*.d.ts,**/*.constants.ts,src/components/ui/**,src/modules/*/views/**,src/app/**/page.tsx,src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/**/error.tsx,src/app/**/not-found.tsx,src/mocks/**,src/test/**,src/instrumentation.ts,src/di/server-dependencies.ts

# Katalog pesan i18n berisi pasangan kunci-nilai dengan bentuk yang sama; "duplikasi" di sana bukan logika yang bisa diekstrak.
sonar.cpd.exclusions=src/core/i18n/*.messages.ts
