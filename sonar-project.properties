# Konfigurasi SonarCloud. Samakan organization dan projectKey dengan yang tertera di sonarcloud.io.
sonar.organization=ptserverjangantumbang-bookingticket
sonar.projectKey=fe-web-rusuh-war-ticketing
sonar.projectName=fe-web-rusuh-war-ticketing

sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/*.stories.tsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
